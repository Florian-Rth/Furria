<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FCC Club-App — Persons &amp; Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
  a { color: #E11D2A; } a:hover { color: #B3101C; }
  @keyframes fcc-float { 0%, 100% { translate: 0 0; rotate: 0deg; } 50% { translate: 4px -8px; rotate: 14deg; } }
  @keyframes pg-shim { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: no-preference) { .fcc-floaty { animation: fcc-float 7s ease-in-out infinite; } }
  .fcc-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  .fcc-scroll::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="fcc-logos.jsx"></script>
<script type="text/babel" src="fcc-shared.jsx"></script>
<script type="text/babel" src="fcc-theme.jsx"></script>
<script type="text/babel" src="fcc-ds-shell.jsx"></script>
<script type="text/babel" src="fcc-pg-kit.jsx"></script>
<script type="text/babel" src="fcc-pg-dir.jsx"></script>
<script type="text/babel" src="fcc-pg-hub.jsx"></script>
<script type="text/babel" src="fcc-pg-admin.jsx"></script>
<script type="text/babel" src="fcc-pg-roles.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, ChromeWindow } = window;
const W = 1400, MOBW = 400, MOBH = 858;
const Win = ({ h, url = 'app.furria.de', children }) => (
  <ChromeWindow width={W} height={h} url={url} tabs={[{ title: 'FURRIA Club-App' }]}>{children}</ChromeWindow>
);

function App() {
  return (
    <DesignCanvas title="FCC Club-App — Personen &amp; Gruppen" subtitle="Block 2 der offiziellen Mocks · Verzeichnis, Gruppen-Hub, Verwaltung · Sprache: Layout D">

      <DCSection id="verzeichnis" title="① Verzeichnis · Mitglieder &amp; Person" subtitle="Lesend für alle im Verein. Status, Ehrenmitglied, Gruppen, Ämter — plus reservierter Platz für „hat Schlüssel“.">
        <DCArtboard id="mem-m" label="Mobile · /members — Liste" width={MOBW} height={MOBH}><window.PgMembersMob /></DCArtboard>
        <DCArtboard id="mem-m-load" label="Mobile · /members — lädt" width={MOBW} height={MOBH}><window.PgMembersMob state="load" /></DCArtboard>
        <DCArtboard id="mem-m-empty" label="Mobile · /members — kein Treffer" width={MOBW} height={MOBH}><window.PgMembersMob state="empty" /></DCArtboard>
        <DCArtboard id="mem-d" label="Desktop · /members — Tabelle + Buchstaben-Register" width={W} height={1150}><Win h={1150}><window.PgMembersDesk /></Win></DCArtboard>
        <DCArtboard id="per-m" label="Mobile · /members/anna — Kontakt freigegeben" width={MOBW} height={MOBH}><window.PgPersonMob who="Anna Brunner" /></DCArtboard>
        <DCArtboard id="per-m-hidden" label="Mobile · /members/lena — Kontakt nicht freigegeben" width={MOBW} height={MOBH}><window.PgPersonMob who="Lena Sommer" hidden /></DCArtboard>
        <DCArtboard id="per-d" label="Desktop · Person — Ehrenmitglied, Kontakt privat" width={W} height={860}><Win h={860}><window.PgPersonDesk who="Christa Vogel" hidden /></Win></DCArtboard>
        <DCArtboard id="per-d-amt" label="Desktop · Person — dasselbe mit Recht „Personendetails sehen“" width={W} height={860}><Win h={860}><window.PgPersonDesk who="Christa Vogel" hidden canSeeAnyway /></Win></DCArtboard>
        <DCArtboard id="per-d-kein" label="Desktop · Person ohne Mitgliedschaft (Trainerin der Kindergarde)" width={W} height={860}><Win h={860}><window.PgPersonDesk who="Elif Kaya" hidden={false} /></Win></DCArtboard>
      </DCSection>

      <DCSection id="gruppen" title="② Gruppen · Schaufenster &amp; eine Gruppe" subtitle="Die Einheiten des Vereins, nicht eine Tabelle: Beschreibung, Größe, „sucht Verstärkung“ — und ein reservierter Bilder-Bereich.">
        <DCArtboard id="grps-m" label="Mobile · /groups" width={MOBW} height={MOBH}><window.PgGroupsMob /></DCArtboard>
        <DCArtboard id="grps-m-load" label="Mobile · /groups — lädt" width={MOBW} height={MOBH}><window.PgGroupsMob state="load" /></DCArtboard>
        <DCArtboard id="grps-d" label="Desktop · /groups — Schaufenster inkl. ruhender Gruppen" width={W} height={1215}><Win h={1215}><window.PgGroupsDesk /></Win></DCArtboard>
        <DCArtboard id="grp-m" label="Mobile · /groups/tanzgarde — oben" width={MOBW} height={MOBH}><window.PgGroupMob /></DCArtboard>
        <DCArtboard id="grp-m-low" label="Mobile · /groups/tanzgarde — weiter unten (Bilder)" width={MOBW} height={MOBH}><window.PgGroupMob lower /></DCArtboard>
        <DCArtboard id="grp-d" label="Desktop · /groups/tanzgarde" width={W} height={1000}><Win h={1000}><window.PgGroupDesk /></Win></DCArtboard>
      </DCSection>

      <DCSection id="hub" title="③ Gruppen-Hub · als Mitglied und als Gruppen-Admin" subtitle="Ein Hub pro Gruppe, in der ich drin bin. Für Gruppen-Admins wird derselbe Screen schreibfähig — inline, ohne zweite Oberfläche.">
        <DCArtboard id="hub-m" label="Mobile · Hub als Mitglied — oben" width={MOBW} height={MOBH}><window.PgGroupMob hub /></DCArtboard>
        <DCArtboard id="hub-m-low" label="Mobile · Hub als Mitglied — Termine &amp; Bilder" width={MOBW} height={MOBH}><window.PgGroupMob hub lower /></DCArtboard>
        <DCArtboard id="hub-m-adm" label="Mobile · Hub als Gruppen-Admin — oben" width={MOBW} height={MOBH}><window.PgGroupMob hub admin /></DCArtboard>
        <DCArtboard id="hub-m-adm-low" label="Mobile · Gruppen-Admin — Mitglieder verwalten" width={MOBW} height={MOBH}><window.PgGroupMob hub admin lower /></DCArtboard>
        <DCArtboard id="hub-m-add" label="Mobile · Mitglied aufnehmen (Blatt)" width={MOBW} height={MOBH}><window.PgGroupMob hub admin sheet={<window.PgSheetAddMember />} /></DCArtboard>
        <DCArtboard id="hub-m-adm2" label="Mobile · Gruppen-Admin ernennen (Blatt)" width={MOBW} height={MOBH}><window.PgGroupMob hub admin sheet={<window.PgSheetAddAdmin />} /></DCArtboard>
        <DCArtboard id="hub-m-conf" label="Mobile · Zugehörigkeit beenden — Bestätigung" width={MOBW} height={MOBH}><window.PgGroupMob hub admin sheet={<window.PgConfirmEnd />} /></DCArtboard>
        <DCArtboard id="hub-d" label="Desktop · Hub als Mitglied" width={W} height={1080}><Win h={1080}><window.PgHubDesk /></Win></DCArtboard>
        <DCArtboard id="hub-d-adm" label="Desktop · Hub als Gruppen-Admin — inline verwalten" width={W} height={1345}><Win h={1345}><window.PgHubDesk admin /></Win></DCArtboard>
        <DCArtboard id="hub-d-add" label="Desktop · Mitglied aufnehmen — Dialog" width={W} height={960}><Win h={960}><window.PgHubDesk admin add /></Win></DCArtboard>
        <DCArtboard id="hub-d-conf" label="Desktop · Zugehörigkeit beenden — Dialog" width={W} height={960}><Win h={960}><window.PgHubDesk admin confirm /></Win></DCArtboard>
      </DCSection>

      <DCSection id="profil" title="④ Mein Profil · eine neue Einstellung" subtitle="„Meine Kontaktdaten für Mitglieder sichtbar“ — aus als Standard, mit ehrlicher Erklärung und Vorschau dessen, was andere sehen.">
        <DCArtboard id="prof-m-off" label="Mobile · Einstellung aus (Standard)" width={MOBW} height={MOBH}><window.PgProfileMob /></DCArtboard>
        <DCArtboard id="prof-m-on" label="Mobile · Einstellung an" width={MOBW} height={MOBH}><window.PgProfileMob on /></DCArtboard>
        <DCArtboard id="prof-d-off" label="Desktop · aus — mit Vorschau" width={W} height={880}><Win h={880}><window.PgProfileDesk /></Win></DCArtboard>
        <DCArtboard id="prof-d-on" label="Desktop · an" width={W} height={880}><Win h={880}><window.PgProfileDesk on /></Win></DCArtboard>
      </DCSection>

      <DCSection id="verwaltung" title="⑤ Verwaltung · Personen, Gruppen, Rollen" subtitle="Für Inhaber der jeweiligen Rechte. Dichter und werkzeughafter, aber gleiche Farben, Typo und Kanten. Bestätigungen sind immer Dialoge.">
        <DCArtboard id="adm-p" label="Desktop · /persons — Personenverwaltung" width={W} height={1315}><Win h={1315}><window.PgAdminPersonsDesk /></Win></DCArtboard>
        <DCArtboard id="adm-p-load" label="Desktop · lädt" width={W} height={970}><Win h={970}><window.PgAdminPersonsDesk state="load" /></Win></DCArtboard>
        <DCArtboard id="adm-p-empty" label="Desktop · kein Treffer" width={W} height={665}><Win h={665}><window.PgAdminPersonsDesk state="empty" /></Win></DCArtboard>
        <DCArtboard id="adm-p-m" label="Mobile · Personenverwaltung" width={MOBW} height={MOBH}><window.PgAdminPersonsMob /></DCArtboard>
        <DCArtboard id="adm-pe" label="Desktop · Person bearbeiten — datierte Fakten" width={W} height={1120}><Win h={1120}><window.PgAdminPersonEditDesk editor={false} /></Win></DCArtboard>
        <DCArtboard id="adm-pe-ed" label="Desktop · einen datierten Fakt anlegen (Ruhezeit)" width={W} height={1420}><Win h={1420}><window.PgAdminPersonEditDesk editor /></Win></DCArtboard>
        <DCArtboard id="adm-g" label="Desktop · /groups/manage — Gruppenverwaltung" width={W} height={950}><Win h={950}><window.PgAdminGroupsDesk /></Win></DCArtboard>
        <DCArtboard id="adm-g-conf" label="Desktop · Gruppe archivieren — Dialog" width={W} height={950}><Win h={950}><window.PgAdminGroupsDesk confirm /></Win></DCArtboard>
        <DCArtboard id="adm-r" label="Desktop · /roles — Rollen &amp; Rechte (Master-Detail)" width={W} height={2900}><Win h={2900}><window.PgRolesDesk /></Win></DCArtboard>
        <DCArtboard id="adm-r-basis" label="Desktop · Grundrolle „Mitglied“ — nichts zu vergeben" width={W} height={2860}><Win h={2860}><window.PgRolesDesk role="mitglied" /></Win></DCArtboard>
        <DCArtboard id="adm-r-fin" label="Desktop · Rolle „Finanzen“ — schmaler Zuschnitt" width={W} height={2880}><Win h={2880}><window.PgRolesDesk role="finanzen" /></Win></DCArtboard>
        <DCArtboard id="adm-r-conf" label="Desktop · Inhaber beenden — Dialog" width={W} height={950}><Win h={950}><window.PgRolesDesk confirm /></Win></DCArtboard>
        <DCArtboard id="adm-r-m" label="Mobile · /roles — Rollen" width={MOBW} height={MOBH}><window.PgRolesMob /></DCArtboard>
        <DCArtboard id="adm-r-m-det" label="Mobile · eine Rolle mit ihren Rechten" width={MOBW} height={MOBH}><window.PgRolesMob role="finanzen" /></DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
