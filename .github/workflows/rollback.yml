name: Rollback

# Repoints an app's :latest (what Watchtower follows) to an earlier immutable sha-<short> image,
# without a rebuild. The running sha is the "+<sha>" suffix of GET /api/health's version. The
# next green main that changes the app moves :latest forward again.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App whose :latest to repoint
        required: true
        type: choice
        options: [api, website, club-app]
      tag:
        description: Image tag to roll back to (sha-<short>, e.g. sha-1a2b3c4)
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    concurrency:
      group: latest-${{ inputs.app }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/furria-${{ inputs.app }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse anything but an immutable sha tag
        run: |
          if ! [[ "$TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::error::'$TAG' is not a sha-<short> tag."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Repoint :latest
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TAG"
          echo "$IMAGE:latest -> $TAG" >> "$GITHUB_STEP_SUMMARY"
