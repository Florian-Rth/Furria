services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: furria
      POSTGRES_PASSWORD: furria
      POSTGRES_DB: furria
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 moved PGDATA below /var/lib/postgresql (versioned subdir) - mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furria -d furria"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  waha:
    image: devlikeapro/waha:gows-2026.10.1
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_API_KEY: furria-development-waha-api-key
      WAHA_DASHBOARD_USERNAME: furria
      WAHA_DASHBOARD_PASSWORD: furria
      WHATSAPP_HOOK_URL: http://host.docker.internal:5100/api/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: session.status,poll.vote,poll.vote.failed,event.response,group.v2.participants,message
      WHATSAPP_HOOK_HMAC_KEY: furria-development-whatsapp-webhook-key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      # The session keys decrypt poll votes - losing them loses every vote on earlier polls.
      - waha-sessions:/app/.sessions

volumes:
  postgres-data:
  waha-sessions:
